<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomi · TV probe</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; font-size: 24px; }
  main { padding: 40px 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(760px, 1fr)); gap: 24px 48px; }
  h1 { margin: 0 0 8px; font-size: 40px; grid-column: 1 / -1; }
  .intro { grid-column: 1 / -1; color: #bbb; margin: 0; }
  section h2 { margin: 0 0 12px; font-size: 30px; color: #F2B544; }
  .line { display: flex; gap: 14px; padding: 4px 0; line-height: 1.35; }
  .ok { color: #6EE7A0; font-weight: 700; min-width: 1.6em; }
  .nok { color: #FF8A8A; font-weight: 700; min-width: 1.6em; }
  .info { color: #bbb; min-width: 1.6em; }
  .small { color: #bbb; font-size: 20px; word-break: break-all; }
  video { width: 480px; height: 270px; background: #111; margin-top: 8px; }
  #report { grid-column: 1 / -1; font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<main id="output">
  <h1>Yomi · TV probe</h1>
  <p class="intro">Measurements start automatically. Wait until "Report" at the bottom shows a result. Then press the keys listed in the "Keys" section.</p>
</main>
<script>
  // Safety net for older browsers: show errors and the user agent if probe.js does not start.
  window.hlsFailed = false;
  window.probeStarted = false;
  function showError(t) {
    var p = document.createElement('p');
    p.style.color = '#FF8A8A';
    p.textContent = t;
    document.getElementById('output').appendChild(p);
  }
  window.onerror = function (m, source, line) { showError('Error: ' + m + ' (' + source + ':' + line + ')'); };
  setTimeout(function () { if (!window.probeStarted) showError('probe.js did not start. User agent: ' + navigator.userAgent); }, 3000);
</script>
<script async src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" onerror="window.hlsFailed = true"></script>
<script type="module" src="./probe.js"></script>
</body>
</html>
