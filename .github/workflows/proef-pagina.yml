name: Tv-proef publiceren

on:
  push:
    branches: [main]
    paths: ['proef/pagina/**', '.github/workflows/proef-pagina.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proef/pagina
      - id: deploy
        uses: actions/deploy-pages@v4
